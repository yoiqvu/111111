<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>формы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <fieldset>
            <p>Ваши личные данные</p>

            <label class="label1">
                Ваше имя
                <input 
                type="text"
                inputmode="text"
                required
                placeholder="Имя"
                name="name"
                >
            </label>

            <label class="label">
                Ваш возраст
                <input 
                type="number"
                inputmode="numeric"
                required
                name="age"
                placeholder="Возраст"
                >
            </label>

            <label class="label">
                Ваш номер телефона
                <input
                type="tel"
                inputmode="tel"
                required
                placeholder="Номер телефона"
                name="phone">
            </label>

            <label class="label">
                Ваша почта
                <input
                type="email"
                inputmode="email"
                required
                name="email"
                placeholder="Почта">
            </label>

            <label class="label">
                Сообщение
                <textarea
                name="message"
                placeholder="Ваше сообщение"
                required
            ></textarea>
            </label>

            <label class="rules">
                <input
                type="checkbox"
                required
                >
                Я принимаю правила
            </label>

                <button 
                class="button" 
                type="submit">
                Отправить
                </button>
            
        </fieldset>
    </form>
</body>
</html>
